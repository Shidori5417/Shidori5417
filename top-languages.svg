<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Top Programming Languages</title>
  <desc id="desc">Programming languages ranked by repository coverage. This is an approximate ordering and does not show percentages.</desc>
  <defs>
