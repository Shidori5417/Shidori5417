  </defs>
  <rect x="1" y="1" width="718" height="358" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="34" y="42" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">TOP PROGRAMMING LANGUAGES</text>
  <text x="34" y="66" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="12">Ranked by repository coverage · no percentage claims</text>
