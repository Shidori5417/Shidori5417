# More otomatiktir: sabitlenmemiş (pinned) ve Featured'da olmayan tüm public repolar listelenir.
# Aşağıdakiler isteğe bağlı geçersiz kılmalardır; yoksa GitHub açıklaması kullanılır.
# Durum ipucu (" · on hold" / " · prototype" / " · maintenance") status.yml'den gelir, buraya yazılmaz.
blurbs:
  proxyforge: "fast, concurrent proxy checker for HTTP/HTTPS/SOCKS4/SOCKS5 with a live TUI dashboard, GeoIP and a rotating proxy server, in Rust"
  arctop: "live terminal monitor for Intel Arc GPUs (frequency, power, engine load, per-process GPU/VRAM), no root needed, in Rust"
  helios-agent: "provider-neutral terminal coding agent in Rust (permission-checked tools, ratatui TUI, MCP/LSP)"
  Bandwidth-Prioritizer: "network traffic shaper that throttles background apps while priority apps like Discord or Zoom run, in Rust"
  DomainSniper: "24/7 domain status monitor (DNS/RDAP/WHOIS) with Discord/Telegram alerts, in Rust"
  VanityGozcu: "Discord vanity URL monitor with a ratatui TUI and Discord/Telegram notifications, in Rust"
  Context-Switcher: "switch work modes with one command (processes, window layout, browser, audio), Python CLI/TUI"
  ExifGhost: "desktop app that strips metadata from photos, audio and video locally, Python"
  micctl: "PipeWire mic DSP and soundboard CLI/TUI, the predecessor of micforge"

# Bağlantıdan sonra "(etiket)" olarak yazılır.
labels:
  DomainSniper: "DomainGözcü"
