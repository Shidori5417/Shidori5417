name: Update language breakdown

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

concurrency:
  group: language-breakdown
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check statistics token
        id: token
        shell: bash
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [[ -n "$GH_STATS_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the GH_STATS_TOKEN repository secret to enable private-repository language totals."
          fi

      - name: Check out profile repository
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate language breakdown
        if: steps.token.outputs.configured == 'true'
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_language_stats.py

      - name: Commit updated card
        if: steps.token.outputs.configured == 'true'
        shell: bash
        run: |
          if git diff --quiet -- top-languages.svg; then
            echo "Language breakdown is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-languages.svg
          git commit -m "chore: update language breakdown"
          git push
