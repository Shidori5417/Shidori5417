name: Profili güncelle

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  cards:
    name: İstatistik kartları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GH_STATS_TOKEN tanımlı değilse yalnızca public repolar sayılır.
      - name: Kartları üret
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python scripts/build_cards.py

      - name: Değiştiyse commit at
        run: |
          # Sadece tarih değiştiyse commit atma
          if git diff --quiet -I '[0-9][0-9][.][0-9][0-9][.][0-9][0-9][0-9][0-9]' -- assets; then
            echo "Kartlar güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: profil kartlarını güncelle"
          git pull --rebase
          git push

  snake:
    name: Katkı yılanı
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#58a6ff
            dist/snake-light.svg?palette=github-light&color_snake=#0969da

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: katkı yılanını güncelle"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
