name: Profili güncelle

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/projects.yml"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  # Çalışan bir commit+deploy adımı yarıda kesilmesin; yeni çalışma sıra bekler.
  cancel-in-progress: false

jobs:
  cards:
    name: Kartlar ve profil verisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GH_STATS_TOKEN tanımlı değilse yalnızca public repolar sayılır.
      - name: Kartları üret
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python scripts/build_cards.py

      # Featured/More/Now bölümlerini ve data/profile.json dosyasını üretir.
      - name: README bölümlerini ve profile.json'ı üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          pip install --quiet pyyaml
          python scripts/build_profile.py

      - name: Değiştiyse commit at
        id: commit
        run: |
          git add -N README.md data assets
          changed=false
          # Kartlarda sadece tarih değiştiyse sayma
          if ! git diff --quiet -I '[0-9][0-9][.][0-9][0-9][.][0-9][0-9][0-9][0-9]' -- assets; then
            changed=true
          fi
          if ! git diff --quiet -- README.md data; then
            changed=true
          fi
          if [ "$changed" != "true" ]; then
            echo "Her şey güncel."
            exit 0
          fi
          # Portföyü yalnızca sitenin gösterdiği alanlar değiştiyse yeniden dağıt:
          # generatedAt/activityScore/lastWorkAt tek başına değişirse commit atılır ama deploy tetiklenmez.
          if ! git diff --quiet -- data/profile.json; then
            strip='del(.generatedAt) | del(.repos[]?.activityScore, .repos[]?.lastWorkAt)'
            before=$(git show HEAD:data/profile.json 2>/dev/null | jq -S "$strip" 2>/dev/null || echo "none")
            after=$(jq -S "$strip" data/profile.json)
            if [ "$before" != "$after" ]; then
              echo "profile_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "profile.json'da yalnızca gürültü alanları değişti; dağıtım atlanacak."
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md data
          git commit -m "chore: profil kartlarını ve verisini güncelle"
          # Elle yapılan bir push ile yarışırsa birkaç kez dene; üretilen dosyalar kazanır.
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Push başarısız oldu." >&2
          exit 1

      # data/profile.json değiştiyse portföy sitesini yeniden dağıt (hook tanımlıysa).
      - name: Portföyü yeniden dağıt
        if: steps.commit.outputs.profile_changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK tanımlı değil; atlandı."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Dağıtım tetiklendi."
