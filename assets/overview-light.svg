<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-label="GitHub genel bakış">
<title>GitHub genel bakış</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/>
  </linearGradient>
</defs>
<style>
  .s { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; } .m { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  
</style>
<rect x="0.5" y="0.5" width="439" height="249" rx="14" fill="#ffffff" stroke="#d0d7de"/>

<text class="s" x="24" y="36" font-size="15" font-weight="700" fill="#1f2328">Genel bakış</text>
<text class="s" x="416" y="36" font-size="10.5" text-anchor="end" fill="#59636e">12.11.2026</text>
<g class="fade" style="animation-delay:0.10s"><rect x="18" y="58" width="3" height="48" rx="1.5" fill="url(#g)"/><text class="s" x="28" y="92" font-size="26" font-weight="700" fill="#1f2328">31</text><text class="s" x="28" y="112" font-size="11" fill="#59636e">Toplam repo</text></g><g class="fade" style="animation-delay:0.18s"><rect x="150" y="58" width="3" height="48" rx="1.5" fill="url(#g)"/><text class="s" x="160" y="92" font-size="26" font-weight="700" fill="#1f2328">12</text><text class="s" x="160" y="112" font-size="11" fill="#59636e">Public repo</text></g><g class="fade" style="animation-delay:0.26s"><rect x="282" y="58" width="3" height="48" rx="1.5" fill="url(#g)"/><text class="s" x="292" y="92" font-size="26" font-weight="700" fill="#1f2328">1</text><text class="s" x="292" y="112" font-size="11" fill="#59636e">Yıldız</text></g><g class="fade" style="animation-delay:0.34s"><rect x="18" y="136" width="3" height="48" rx="1.5" fill="url(#g)"/><text class="s" x="28" y="170" font-size="26" font-weight="700" fill="#1f2328">327</text><text class="s" x="28" y="190" font-size="11" fill="#59636e">Katkı · son 1 yıl</text></g><g class="fade" style="animation-delay:0.42s"><rect x="150" y="136" width="3" height="48" rx="1.5" fill="url(#g)"/><text class="s" x="160" y="170" font-size="26" font-weight="700" fill="#1f2328">207</text><text class="s" x="160" y="190" font-size="11" fill="#59636e">Commit · son 1 yıl</text></g><g class="fade" style="animation-delay:0.50s"><rect x="282" y="136" width="3" height="48" rx="1.5" fill="url(#g)"/><text class="s" x="292" y="170" font-size="26" font-weight="700" fill="#1f2328">Java</text><text class="s" x="292" y="190" font-size="11" fill="#59636e">En çok dil</text></g>
<text class="s" x="24" y="234" font-size="10" fill="#59636e">Toplam, private repoları da içerir · 2024'ten beri GitHub'da</text>
