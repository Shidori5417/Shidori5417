<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-label="Dil dağılımı">
<title>Dil dağılımı</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
  </linearGradient>
</defs>
<style>
  .s { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; } .m { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  
</style>
<rect x="0.5" y="0.5" width="439" height="249" rx="14" fill="#0d1117" stroke="#30363d"/>

<text class="s" x="24" y="36" font-size="15" font-weight="700" fill="#e6edf3">En çok kullandığım diller</text>
<clipPath id="bar"><rect x="24" y="56" width="392" height="10" rx="5"/></clipPath>
<g clip-path="url(#bar)"><rect x="24.00" y="56" width="389.74" height="10" fill="#dea584"/><rect x="413.74" y="56" width="2.26" height="10" fill="#89e051"/></g>
<g class="fade" style="animation-delay:0.10s"><circle cx="29" cy="96" r="5" fill="#dea584"/><text class="s" x="40" y="100" font-size="12.5" fill="#e6edf3">Rust</text><text class="s" x="206" y="100" font-size="12" text-anchor="end" fill="#8b949e">99.4%</text></g><g class="fade" style="animation-delay:0.16s"><circle cx="229" cy="96" r="5" fill="#89e051"/><text class="s" x="240" y="100" font-size="12.5" fill="#e6edf3">Shell</text><text class="s" x="406" y="100" font-size="12" text-anchor="end" fill="#8b949e">0.6%</text></g>
</svg>
